header:
  version: 19

distro: poky

target:
  - core-image-minimal

local_conf_header:
  demo-login: |
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
  tgbs-kernel: |
    PREFERRED_PROVIDER_virtual/kernel = "linux-tgbs"
  preempt-rt: |
    DISTRO_FEATURES:append = " preempt-rt"
  kernel-debug: |
    DISTRO_FEATURES:append = " kdebug"

repos:
  poky:
    path: src/poky
    layers:
      meta:
      meta-poky:
  meta-openembedded:
    path: src/meta-openembedded
    layers:
      meta-oe:
  meta-tgbs:
    path: src/meta-tgbs
  meta-kdebug:
    path: src/meta-kdebug
