header:
  version: 19

distro: tgbs-demo

target:
  - tgbs-demo-image

local_conf_header:
  demo-login: |
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
  tgbs-kernel: |
    PREFERRED_PROVIDER_virtual/kernel = "linux-tgbs"

repos:
  poky:
    path: src/poky
    layers:
      meta:
      meta-poky:
  meta-openembedded:
    path: src/meta-openembedded
    layers:
      meta-oe:
  meta-tgbs:
    path: src/meta-tgbs
  meta-kdebug:
    path: src/meta-kdebug
  meta-tgbs-demo:
    path: src/meta-tgbs-demo
