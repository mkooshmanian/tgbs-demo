BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tgbs-demo"
BBFILE_PATTERN_meta-tgbs-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tgbs-demo = "7"

LAYERDEPENDS_meta-tgbs-demo = "core openembedded-layer meta-tgbs meta-kdebug"
LAYERSERIES_COMPAT_meta-tgbs-demo = "scarthgap"
