require conf/distro/poky.conf

DISTRO = "tgbs-demo"
DISTRO_NAME = "TGBS demonstration distribution"
DISTRO_VERSION = "1.0"

DISTRO_FEATURES:append = " kdebug preempt-rt"

# Keep the unauthenticated demo services local to the QEMU host.  These rules
# are used when runqemu is started with its slirp option.
QB_SLIRP_OPT:qemuarm32 = "-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22"

hostname:pn-base-files = "tgbs-demo"
