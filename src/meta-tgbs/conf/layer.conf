BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tgbs"
BBFILE_PATTERN_meta-tgbs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tgbs = "6"

LAYERSERIES_CORENAMES = "scarthgap"
LAYERSERIES_COMPAT_meta-tgbs = "scarthgap"
LAYERDEPENDS_meta-tgbs = "core"
